<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" fill="none">
  <defs>
    <linearGradient id="pap-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fa9e8"/>
      <stop offset="100%" stop-color="#d5edfb"/>
    </linearGradient>
    <radialGradient id="pap-sun" cx="18%" cy="6%" r="62%">
      <stop offset="0%" stop-color="#fffad6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fffad6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pap-hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78c463"/>
      <stop offset="100%" stop-color="#4f9a42"/>
    </linearGradient>
    <linearGradient id="pap-log" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c99a5c"/>
      <stop offset="55%" stop-color="#a9763f"/>
      <stop offset="100%" stop-color="#7c5327"/>
    </linearGradient>
  </defs>

  <rect width="200" height="140" fill="url(#pap-sky)"/>
  <rect width="200" height="140" fill="url(#pap-sun)"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.86">
    <ellipse cx="46" cy="22" rx="13" ry="5.4"/>
    <ellipse cx="39" cy="24" rx="7" ry="4"/>
    <ellipse cx="53" cy="24" rx="8" ry="4.2"/>
    <ellipse cx="152" cy="16" rx="15" ry="6"/>
    <ellipse cx="143" cy="18.5" rx="8" ry="4.4"/>
    <ellipse cx="162" cy="18.5" rx="9" ry="4.6"/>
  </g>

  <!-- snowy peaks -->
  <g fill="#8fa9c9">
    <path d="M-6 84 L20 52 L46 84 Z"/>
    <path d="M34 84 L62 46 L90 84 Z"/>
    <path d="M96 84 L118 56 L140 84 Z"/>
  </g>
  <g fill="#ffffff" opacity="0.94">
    <path d="M20 52 L27 61 L23 59 L18.5 62 L13 61 Z"/>
    <path d="M62 46 L70 56 L65 54 L60 57 L54 56 Z"/>
    <path d="M118 56 L124 63 L120.5 61.5 L117 64 L112 63 Z"/>
  </g>

  <!-- hills -->
  <path d="M-6 140 L-6 88 Q40 78 84 88 Q140 100 206 82 L206 140 Z" fill="#7ec06a"/>
  <path d="M-6 140 L-6 104 Q52 92 104 104 Q156 114 206 100 L206 140 Z" fill="url(#pap-hill)"/>

  <!-- earth the steps are cut into -->
  <path d="M14 128 L150 46 L150 60 L14 140 Z" fill="#b98b58"/>

  <!-- twelve log steps, bottom-left to top-right -->
  <g fill="url(#pap-log)">
    <rect x="14" y="122.5" width="20" height="7" rx="3.4"/>
    <rect x="25" y="115.5" width="20" height="7" rx="3.4"/>
    <rect x="36" y="108.5" width="20" height="7" rx="3.4"/>
    <rect x="47" y="101.5" width="20" height="7" rx="3.4"/>
    <rect x="58" y="94.5" width="20" height="7" rx="3.4"/>
    <rect x="69" y="87.5" width="20" height="7" rx="3.4"/>
    <rect x="80" y="80.5" width="20" height="7" rx="3.4"/>
    <rect x="91" y="73.5" width="20" height="7" rx="3.4"/>
    <rect x="102" y="66.5" width="20" height="7" rx="3.4"/>
    <rect x="113" y="59.5" width="20" height="7" rx="3.4"/>
    <rect x="124" y="52.5" width="20" height="7" rx="3.4"/>
    <rect x="135" y="45.5" width="20" height="7" rx="3.4"/>
  </g>

  <!-- gate at the summit -->
  <g fill="#7c5327">
    <rect x="132" y="20" width="4" height="27" rx="1.6"/>
    <rect x="158" y="20" width="4" height="27" rx="1.6"/>
  </g>
  <rect x="126" y="18" width="42" height="5" rx="2" fill="#a9763f"/>
  <rect x="130" y="26" width="34" height="3.4" rx="1.4" fill="#c99a5c"/>

  <!-- climbers with their numbers -->
  <g>
    <!-- blue, low -->
    <circle cx="34" cy="107" r="9" fill="#2f6fe0"/>
    <text x="34" y="110.6" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <rect x="30.6" y="116" width="1.2" height="4" fill="#6b5233"/>
    <rect x="28.5" y="119" width="6" height="8" rx="2.6" fill="#2f6fe0"/>
    <circle cx="31.5" cy="117.5" r="2.6" fill="#f3cfa8"/>

    <!-- amber, middle -->
    <circle cx="76" cy="79" r="9" fill="#e8a317"/>
    <text x="76" y="82.6" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <rect x="72.6" y="88" width="1.2" height="4" fill="#6b5233"/>
    <rect x="70.5" y="91" width="6" height="8" rx="2.6" fill="#e8a317"/>
    <circle cx="73.5" cy="89.5" r="2.6" fill="#f3cfa8"/>

    <!-- green, high -->
    <circle cx="118" cy="51" r="9" fill="#2f9e4f"/>
    <text x="118" y="54.6" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="114.6" y="60" width="1.2" height="4" fill="#6b5233"/>
    <rect x="112.5" y="63" width="6" height="8" rx="2.6" fill="#2f9e4f"/>
    <circle cx="115.5" cy="61.5" r="2.6" fill="#f3cfa8"/>
  </g>
</svg>
