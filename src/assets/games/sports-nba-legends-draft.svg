<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" fill="none">
  <defs>
    <linearGradient id="nbald-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243149"/><stop offset="1" stop-color="#0f1420"/>
    </linearGradient>
    <linearGradient id="nbald-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#212a3d"/><stop offset="1" stop-color="#191f2e"/>
    </linearGradient>
    <linearGradient id="nbald-ball" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8146"/><stop offset="1" stop-color="#e8551c"/>
    </linearGradient>
    <linearGradient id="nbald-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#f4c445"/>
    </linearGradient>
  </defs>

  <rect width="200" height="140" fill="url(#nbald-bg)"/>
  <!-- parqué -->
  <g opacity="0.14">
    <path d="M0 96 L200 78 L200 140 L0 140 Z" fill="#b9752e"/>
    <path d="M20 92 L200 76" stroke="#0f1420" stroke-width="1"/>
    <path d="M0 108 L200 92" stroke="#0f1420" stroke-width="1"/>
    <path d="M0 124 L200 108" stroke="#0f1420" stroke-width="1"/>
  </g>

  <!-- carta trasera -->
  <g transform="rotate(-9 66 70)">
    <rect x="34" y="30" width="60" height="82" rx="9" fill="url(#nbald-card)" stroke="#2f3a52"/>
  </g>
  <!-- carta principal -->
  <g transform="rotate(6 118 70)">
    <rect x="92" y="26" width="62" height="86" rx="10" fill="url(#nbald-card)" stroke="#ff6a2b" stroke-width="1.4"/>
    <text x="147" y="46" font-family="Arial Narrow, sans-serif" font-size="20" font-weight="800" fill="url(#nbald-gold)" text-anchor="end">99</text>
    <text x="147" y="53" font-family="Arial, sans-serif" font-size="5" letter-spacing="1.2" fill="#93a0b8" text-anchor="end">OVR</text>
    <rect x="99" y="38" width="20" height="9" rx="3" fill="none" stroke="#2f3a52"/>
    <text x="109" y="45" font-family="Arial Narrow, sans-serif" font-size="6" font-weight="700" fill="#ff6a2b" text-anchor="middle">BASE</text>
    <!-- balón -->
    <circle cx="122" cy="76" r="17" fill="url(#nbald-ball)"/>
    <path d="M105 76 H139 M122 59 V93 M110 62 Q122 76 110 90 M134 62 Q122 76 134 90"
      stroke="#7a2f10" stroke-width="1.4" fill="none"/>
    <rect x="99" y="99" width="48" height="4" rx="2" fill="#2f3a52"/>
    <rect x="99" y="99" width="34" height="4" rx="2" fill="#f4c445"/>
  </g>

  <!-- dado de década -->
  <g transform="rotate(-6 40 108)">
    <rect x="24" y="92" width="32" height="32" rx="7" fill="#31405c" stroke="#2f3a52"/>
    <text x="40" y="114" font-family="Arial Narrow, sans-serif" font-size="13" font-weight="800" fill="#f4c445" text-anchor="middle">90s</text>
  </g>
</svg>
